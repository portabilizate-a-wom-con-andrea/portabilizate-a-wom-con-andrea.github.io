<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portabilidad WOM</title>
<meta name="description" content="Cámbiate a WOM conservando tu número. Déjame tus datos o escríbeme por WhatsApp.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;
       background:linear-gradient(135deg,#3b0a5c 0%,#7b1fa2 55%,#c2185b 100%);color:#fff;padding:40px 16px;text-align:center}
  .card{max-width:520px;width:100%}
  h1{font-size:clamp(2.4rem,9vw,4rem);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:16px}
  .lead{font-size:1.15rem;opacity:.92;line-height:1.5;margin-bottom:28px}
  form{background:#fff;color:#2a1238;border-radius:20px;padding:28px 22px;text-align:left;box-shadow:0 16px 40px rgba(0,0,0,.3);display:grid;gap:16px}
  form h2{font-size:1.35rem;text-align:center;color:#5b1380}
  label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
  input,select,textarea{font:inherit;font-weight:400;padding:12px 14px;border:1.5px solid #d6c4e2;border-radius:10px;background:#faf7fc;color:#2a1238;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#7b1fa2;box-shadow:0 0 0 3px rgba(123,31,162,.2)}
  textarea{resize:vertical;min-height:80px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:420px){.row{grid-template-columns:1fr}}
  button{font:inherit;font-weight:700;font-size:1.1rem;padding:15px;border:0;border-radius:12px;background:#7b1fa2;color:#fff;cursor:pointer;transition:background .15s}
  button:hover{background:#5b1380}
  .hint{font-size:.82rem;color:#6b5878;text-align:center}
  .or{margin:32px 0 18px;opacity:.85}
  .wa{display:inline-flex;align-items:center;gap:12px;background:#25D366;color:#fff;text-decoration:none;font-size:1.3rem;font-weight:700;
      padding:18px 36px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s}
  .wa:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
  .wa svg{width:30px;height:30px;fill:#fff}
  small{display:block;margin-top:20px;opacity:.7;font-size:.85rem}
</style>
</head>
<body>
<main class="card">
  <h1>Portabilidad WOM</h1>
  <p class="lead">Cámbiate a WOM y conserva tu mismo número. Déjame tus datos y te contacto para ayudarte con todo el proceso.</p>

  <form id="f">
    <h2>Quiero cambiarme a WOM</h2>
    <label>Nombre completo
      <input name="nombre" required autocomplete="name" placeholder="Ej: Juan Pérez">
    </label>
    <label>Número a portar
      <input name="telefono" type="tel" required autocomplete="tel" placeholder="+56 9 1234 5678" pattern="[\d\s+()-]{8,}">
    </label>
    <div class="row">
      <label>Compañía actual
        <select name="compania" required>
          <option value="">Selecciona…</option>
          <option>Entel</option><option>Movistar</option><option>Claro</option>
          <option>Virgin</option><option>Otra</option>
        </select>
      </label>
      <label>Tipo de línea
        <select name="tipo" required>
          <option value="">Selecciona…</option>
          <option>Plan (contrato)</option><option>Prepago</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Comuna
        <input name="comuna" autocomplete="address-level2" placeholder="Ej: Maipú">
      </label>
      <label>Correo (opcional)
        <input name="correo" type="email" autocomplete="email" placeholder="tu@correo.cl">
      </label>
    </div>
    <label>Comentario (opcional)
      <textarea name="comentario" placeholder="¿Qué plan te interesa? ¿Cuántas líneas?"></textarea>
    </label>
    <button type="submit">Enviar mis datos</button>
    <p class="hint">Al enviar se abrirá WhatsApp con tus datos listos para mandar.</p>
  </form>

  <p class="or">¿Prefieres hablar directo?</p>
  <a class="wa" href="https://wa.me/56952526664?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20la%20portabilidad%20a%20WOM" target="_blank" rel="noopener">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.8c1.9 1 4 1.6 6.2 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-4 1.1 1.1-3.9-.3-.4C5.9 20 5.4 18 5.4 16 5.4 10.2 10.2 5.4 16 5.4S26.6 10.2 26.6 16 21.8 26.6 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
    WhatsApp
  </a>
  <small>Escríbeme al +56 9 5252 6664</small>
</main>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var d = new FormData(this);
  var lineas = [
    'Hola, quiero cambiarme a WOM. Mis datos:',
    '• Nombre: ' + d.get('nombre'),
    '• Número a portar: ' + d.get('telefono'),
    '• Compañía actual: ' + d.get('compania'),
    '• Tipo de línea: ' + d.get('tipo')
  ];
  if (d.get('comuna')) lineas.push('• Comuna: ' + d.get('comuna'));
  if (d.get('correo')) lineas.push('• Correo: ' + d.get('correo'));
  if (d.get('comentario')) lineas.push('• Comentario: ' + d.get('comentario'));
  window.open('https://wa.me/56952526664?text=' + encodeURIComponent(lineas.join('\n')), '_blank');
});
</script>
</body>
</html>
